[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minimind-copilot-studio"
version = "0.1.0"
description = "Full-stack React + Monaco Editor + FastAPI/Colab backend for MiniMind code completion models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
